<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>LOT 라벨 출력 | (주)이지원 MES</title>
<script src="/qrcode.min.js"></script>
<script src="/jsbarcode.min.js"></script>
<!-- QZ Tray: defer 없이 동기 로드 -->
<script src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.4/qz-tray.js"></script>
<style>
/* ──── 공통 ──── */
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'맑은 고딕','Malgun Gothic',sans-serif;background:#e8ecf4;-webkit-print-color-adjust:exact;print-color-adjust:exact;}

/* ──── 화면 헤더 ──── */
#screen-ui{background:#1e3a8a;color:#fff;}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:12px;flex-wrap:wrap;}
.top-bar h1{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.badge-model{background:#93c5fd;color:#1e3a8a;font-size:10px;font-weight:800;padding:2px 7px;border-radius:10px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.btn{padding:7px 14px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;}
.btn:hover{filter:brightness(1.1);}
.btn-print{background:#22c55e;color:#fff;}
.btn-ezpl{background:#f59e0b;color:#fff;}
.btn-qz{background:#3b82f6;color:#fff;box-shadow:0 0 0 2px #93c5fd;}
.btn-close{background:rgba(255,255,255,.2);color:#fff;}

/* ──── 설정바 ──── */
.cfg-bar{background:#1e40af;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.1);}
.cfg-group{display:flex;align-items:center;gap:6px;}
.cfg-bar label{font-size:11px;color:#bfdbfe;font-weight:700;white-space:nowrap;}
.cfg-bar input,.cfg-bar select{border:1px solid #3b82f6;border-radius:6px;padding:5px 8px;font-size:12px;background:#1d4ed8;color:#fff;outline:none;}
.cfg-bar input::placeholder{color:#93c5fd;}
.cfg-sep{width:1px;height:20px;background:rgba(255,255,255,.2);margin:0 4px;}
.info-chip{font-size:11px;color:#93c5fd;margin-left:auto;}

/* ──── 미리보기 영역 ──── */
.preview-wrap{padding:24px;display:flex;flex-wrap:wrap;gap:20px;}

/* ══════════════════════════════════════
   라벨 본체 — 80×60mm 흑백 전용 (인쇄 매칭)
══════════════════════════════════════ */
.label{width:80mm;height:60mm;background:#fff;border:1px solid #000;box-sizing:border-box;padding:4mm;position:relative;display:flex;flex-direction:column;overflow:hidden;}

/* ──── 라벨 내부 요소 (강제 흑백) ──── */
.lbl-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;color:#000;padding:2px 0;font-size:10px;font-weight:800;margin-bottom:3mm;}
.lbl-body{display:flex;gap:4mm;flex:1;}
.lbl-left{display:flex;flex-direction:column;align-items:center;gap:3mm;}
.lbl-qr{width:22mm;height:22mm;display:flex;justify-content:center;align-items:center;}
.lbl-barcode-wrap{width:28mm;display:flex;flex-direction:column;align-items:center;}
.lbl-barcode{width:100%;height:12mm;}
.lbl-barcode-text{font-size:7px;letter-spacing:1px;margin-top:1px;font-weight:700;color:#000;}

.lbl-right{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px;}
.lbl-row{display:flex;align-items:center;}
.lbl-row .key{width:10mm;font-size:9px;color:#000;font-weight:600;}
.lbl-row .val{font-weight:800;color:#000;font-size:11px;}

.val-lot{font-size:11px;}
.val-item{font-size:11px;}
.val-thick{font-size:20px;font-weight:900;letter-spacing:-1px;border-bottom:1px solid #000;display:inline-block;padding-bottom:1px;}
.val-spec{font-size:10px;}
.val-sn{font-size:11px;}

.lbl-foot{margin-top:auto;border-top:1px dashed #000;padding-top:2px;display:flex;justify-content:space-between;font-size:8px;color:#000;font-weight:600;}
.badge-tag{border:1px solid #000;padding:1px 4px;border-radius:2px;font-weight:800;}

/* ──── 인쇄용 스타일 ──── */
@media print{
  @page{size:80mm 60mm;margin:0;}
  body{background:#fff;}
  .screen-only{display:none!important;}
  .preview-wrap{padding:0;margin:0;display:block;}
  .label{border:none;margin:0;transform:scale(0.96);transform-origin:top left;}
  * { color: black !important; border-color: black !important; background-color: transparent !important; }
}

/* HOLD 스타일 */
.label.hold-style{border:4px solid #000;}
</style>
</head>
<body>

<!-- ── 화면 전용 UI ── -->
<div id="screen-ui" class="screen-only">
  <div class="top-bar">
    <h1>🏷️ LOT 라벨 출력
      <span class="badge-model">Godex ZA120U · 80×60mm</span>
    </h1>
    <div class="btn-row">
      <button class="btn btn-qz" id="btn-qz" onclick="printViaQzTray()">🖨 Godex 직접 출력 (QZ Tray)</button>
      <button class="btn btn-ezpl" onclick="downloadEZPL()">⬇ GoLabel (.ezp) 파일 저장</button>
      <button class="btn btn-print" onclick="window.print()">🖨 브라우저 인쇄</button>
      <button class="btn btn-close" onclick="window.close()">✕ 닫기</button>
    </div>
  </div>
  <div class="cfg-bar">
    <div class="cfg-group">
      <label>📋 라벨 수량</label>
      <input type="number" id="qty-input" value="1" min="1" max="9999" style="width:65px;font-size:14px;font-weight:700;text-align:center;" oninput="render()">
    </div>
    <div class="cfg-sep"></div>
    <div class="cfg-group">
      <label>시작번호</label>
      <input type="number" id="serial-input" value="1" min="1" style="width:55px" oninput="render()">
    </div>
    <div class="cfg-sep"></div>
    <div class="cfg-group">
      <label>회사명</label>
      <input type="text" id="company-input" value="(주)이지원" style="width:110px" oninput="render()">
    </div>
    <div class="cfg-sep"></div>
    <div class="cfg-group">
      <label>📍 로케이션</label>
      <input type="text" id="location-input" style="width:70px" placeholder="B-2.0" oninput="render()">
    </div>
    <div class="cfg-sep"></div>
    <div class="cfg-group">
      <label>품목명</label>
      <input type="text" id="itemname-input" style="width:120px" placeholder="품목명" oninput="render()">
    </div>
    <div class="cfg-group">
      <label>규격</label>
      <input type="text" id="spec-input" style="width:120px" placeholder="규격" oninput="render()">
    </div>
  </div>
</div>

<div class="preview-wrap" id="preview-area"></div>

<script>
const P = new URLSearchParams(location.search);
function safeDecode(key) {
  const val = P.get(key);
  if (!val) return '';
  try { return decodeURIComponent(val); } catch (e) { return val; }
}

const LOT = {
  id:        P.get('lotId')       || '',
  number:    P.get('lotNumber')   || 'LOT-UNKNOWN',
  itemName:  safeDecode('itemName'),
  spec:      safeDecode('spec'),
  qty:       parseInt(P.get('qty') || '1', 10),
  lotDate:   P.get('lotDate')     || new Date().toISOString().slice(0,10),
  thickness: P.get('thickness')  || '',
  location:  safeDecode('location'),
  lotType:   P.get('lotType')    || 'IN',
};

document.getElementById('qty-input').value      = LOT.qty;
document.getElementById('location-input').value = LOT.location;
document.getElementById('itemname-input').value = LOT.itemName;
document.getElementById('spec-input').value     = LOT.spec;

function getLotTypeLabel(){ return LOT.lotType==='ASM' ? '조립LOT' : LOT.lotType==='STR' ? '구조체LOT' : '입고LOT'; }
function getItemName(){ return document.getElementById('itemname-input').value.trim() || LOT.itemName || '-'; }
function getSpec(){     return document.getElementById('spec-input').value.trim()     || LOT.spec || ''; }
function getLocation(){ return document.getElementById('location-input').value.trim()|| LOT.location || ''; }
function getCompany(){  return document.getElementById('company-input').value.trim() || '(주)이지원'; }
function isHeatSheet(){ return !!LOT.thickness; }

async function genQR(text, imgEl){
  return new Promise((res,rej)=>{
    QRCode.toDataURL(text, {width:85, margin:0, color:{dark:'#000000',light:'#ffffff'}}, (e, url)=>{
      if(e) rej(e);
      else {
        imgEl.src = url;
        res();
      }
    });
  });
}

function genBarcode(text, svgEl){
  JsBarcode(svgEl, text, {format:'CODE128', width:1.5, height:35, displayValue:false, margin:0});
}

async function render(){
  const qty = Math.max(1, parseInt(document.getElementById('qty-input').value)||1);
  const sn0 = Math.max(1, parseInt(document.getElementById('serial-input').value)||1);
  const itemName = getItemName();
  const spec = getSpec();
  const loc = getLocation();
  const company = getCompany();
  const area = document.getElementById('preview-area');
  area.innerHTML = '';

  for(let i=0; i<qty; i++){
    const sn = sn0 + i;
    const qrData = LOT.number;

    const div = document.createElement('div');
    div.className = 'label';
    
    // 차열시트일 경우 두께 강조, 아닐 경우 일반 규격
    const specHtml = isHeatSheet()
      ? `<div class="lbl-row">
           <span class="key">두께</span>
           <span class="val val-thick">${LOT.thickness}T</span>
         </div>
         ${spec ? `<div class="lbl-row"><span class="key">규격</span><span class="val val-spec">${spec}</span></div>` : ''}`
      : spec
        ? `<div class="lbl-row"><span class="key">규격</span><span class="val val-spec">${spec}</span></div>`
        : '';

    div.innerHTML = `
      <div class="lbl-head">
        <span>${company}</span>
        <span class="badge-tag">${sn}/${qty} (${getLotTypeLabel()})</span>
      </div>
      <div class="lbl-body">
        <div class="lbl-left">
          <div class="lbl-qr"><img id="qc-${i}" style="width:22mm;height:22mm;" /></div>
          <div class="lbl-barcode-wrap">
            <svg class="lbl-barcode" id="bc-${i}"></svg>
            <div class="lbl-barcode-text">${qrData}</div>
          </div>
        </div>
        <div class="lbl-right">
          <div class="lbl-row">
            <span class="key">LOT</span>
            <span class="val val-lot">${qrData}</span>
          </div>
          <div class="lbl-row">
            <span class="key">품목</span>
            <span class="val val-item">${itemName}</span>
          </div>
          ${specHtml}
          <div class="lbl-row">
            <span class="key">순번</span>
            <span class="val val-sn">${sn} / ${qty}</span>
          </div>
        </div>
      </div>
      <div class="lbl-foot">
        <span class="lbl-date">입고: ${LOT.lotDate}</span>
        ${loc ? `<span class="lbl-location">📍 ${loc}</span>` : '<span></span>'}
        <span class="lbl-serial">발행: ${sn} / ${qty}</span>
      </div>`;

    area.appendChild(div);
    const richQrPayload = `LOT: ${qrData}\n제품명: ${itemName}\n규격: ${spec || '규격 미기재'}\n위치: ${loc || '-'}\n수량: ${LOT.qty || 1} ${LOT.unit || 'EA'}`;
    await genQR(richQrPayload, div.querySelector(`#qc-${i}`));
    genBarcode(qrData, div.querySelector(`#bc-${i}`));
  }
}

// ── EZPL 생성 (Godex ZA120U 전용) ────────────────────────────
function downloadEZPL(){
  const qty      = Math.max(1, parseInt(document.getElementById('qty-input').value)||1);
  const serial0  = Math.max(1, parseInt(document.getElementById('serial-input').value)||1);
  const itemName = getItemName();
  const spec     = getSpec();
  const loc      = getLocation() || (isHeatSheet() ? `B-${LOT.thickness}` : '');
  const company  = getCompany();

  let prn = '';
  for(let i=0; i<qty; i++){
    const sn     = serial0 + i;
    // 사규 C302: LOT 번호는 절대 변경 금지 — 순번은 라벨 필드에만 표시
    const qrData = LOT.number;

    prn += `\x02L\r\n`;
    prn += `D11\r\n`;
    prn += `ZT\r\n`;

    // QR 코드 (좌측 상단)
    prn += `b10,30,QR,5,M,${qrData}\r\n`;
    // 바코드 (QR 아래, Code128)
    prn += `b10,145,128,2,1,35,${qrData.substring(0,28)}\r\n`;
    // QR/바코드 하단 로트번호 (소자)
    prn += `421070185012${qrData.substring(0,20)}\r\n`;

    // 우측 필드
    prn += `421005030015${company}    ${getLotTypeLabel()}\r\n`;

    // 필드 레이블 + 값
    prn += `421255010013LOT:\r\n`;
    prn += `421300010014${qrData}\r\n`;

    prn += `421255050013품목:\r\n`;
    prn += `421300050015${itemName.substring(0,14)}\r\n`;

    if(isHeatSheet()){
      prn += `421255085013두께:\r\n`;
      prn += `541300085003${LOT.thickness}T\r\n`;  // 확대 폰트
    }
    if(spec){
      prn += `421255100013규격:\r\n`;
      prn += `421300100014${spec.substring(0,16)}\r\n`;
    }

    prn += `421255130013수량:\r\n`;
    prn += `431300130013 1 ${LOT.unit}\r\n`;

    // 구분선
    prn += `L0,168,640,1,1\r\n`;

    // 푸터
    prn += `421010175016입고:${LOT.lotDate}\r\n`;
    if(loc)  prn += `421320175015📍${loc}\r\n`;
    // ★ 항상 넘버링 표시
    prn += `421570175014${sn}/${qty}\r\n`;

    prn += `E\r\n`;
  }

  const blob = new Blob([prn], {type:'text/plain;charset=us-ascii'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `LOT_${LOT.number.replace(/[^A-Za-z0-9\-]/g,'_')}_${qty}ea.ezp`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── QZ Tray 직접 출력 (EZPL → Godex ZA120U) ─────────────────
let _qzReady = false;

// ── 페이지 로드 후 QZ Tray 상태 검사 ──
window.addEventListener('load', function() {
  const btn = document.getElementById('btn-qz');
  if (!btn) return;
  if (typeof qz === 'undefined') {
    btn.textContent = '❌ QZ Tray 라이브러리 로드 실패';
    btn.style.background = '#6b7280';
    btn.title = 'CDN에서 QZ Tray 스크립트를 불러오지 못했습니다. 인터넷 연결 확인 후 새로고침하세요.';
  } else {
    btn.title = 'QZ Tray 시작 및 Allow unsigned apps 체크 후 이 버튼을 누르세요';
  }
});

async function ensureQzReady() {
  if (typeof qz === 'undefined') {
    throw new Error('❌ QZ Tray 스크립트가 로드되지 않았습니다.\n\n⧡ 인터넷 연결이 안되는 환경이라면:\n   GoLabel(.ezp) 파일 저장 버튼을 사용하세요.');
  }
  if (!_qzReady) {
    // 무서명 모드는 security 설정을 아예 안 하면 알아서 동작합니다.
  }
  if (!qz.websocket.isActive()) {
    // HTTPS는 wss://, HTTP는 ws://
    const secure = (window.location.protocol === 'https:');
    try {
      await qz.websocket.connect({
        retries: 3,
        delay: 500,
        host: ['localhost'],
        usingSecure: secure,
      });
    } catch (connErr) {
      if (secure) {
        // HTTPS에서 wss:// 실패 → ws:// 폴백 시도
        await qz.websocket.connect({
          retries: 2,
          delay: 500,
          host: ['localhost'],
          usingSecure: false,
        });
      } else {
        throw connErr;
      }
    }
  }
  _qzReady = true;
}

async function printViaQzTray() {
  const btn = document.getElementById('btn-qz');
  const origText = btn.textContent;
  try {
    if (typeof qz === 'undefined') {
      alert('❌ QZ Tray 라이브러리가 로드되지 않았습니다.');
      return;
    }
    await ensureQzReady();

    let printers = await qz.printers.find('Godex');
    if (!Array.isArray(printers)) printers = printers ? [printers] : [];
    if (printers.length === 0) {
      const all = await qz.printers.find();
      const allList = Array.isArray(all) ? all : [all];
      if (!selected) { btn.textContent = origText; btn.disabled = false; return; }
      printers = [selected.trim()];
    }

    const printer = printers[0];
    btn.textContent = `🖨 "${printer}" 로 전송 중...`;

    // 화면에 렌더링된 라벨 요소(.preview-wrap)를 통째로 캡처하여 Pixel(이미지) 방식으로 전송합니다.
    const qty = Math.max(1, parseInt(document.getElementById('qty-input').value) || 1);
    const labelHtml = document.querySelector('.preview-wrap').innerHTML;
    
    // QZ Tray 설정: 용지 크기 80x60mm 지정, 203dpi, 흑백 모드 강제, 여백 제거
    const config = qz.configs.create(printer, {
      size: { width: 80, height: 60 },
      margins: 0,
      units: 'mm',
      density: 203,
      colorType: 'blackwhite'
    });

    // 화면에 이미 qty 개수만큼 라벨이 렌더링되어 있으므로, 
    // 반복문 없이 한 번만 printData 배열에 담아서 보냅니다.
    const printData = [{
      type: 'pixel',
      format: 'html',
      flavor: 'plain',
      data: `
        <html>
          <head>
            <style>
              @page { size: 80mm 60mm; margin: 0; }
              body, html { margin: 0; padding: 0; width: 80mm; height: 60mm; background: white; font-family: 'Malgun Gothic', sans-serif; overflow: hidden; }
              /* 모든 요소를 강제 흑백 처리하고 크기를 96%로 줄여서 짤림을 방지합니다. */
              .label { 
                width: 80mm !important; height: 60mm !important; 
                box-sizing: border-box; overflow: hidden; page-break-after: always; 
                border: none !important; 
                background: white !important;
                transform: scale(0.96);
                transform-origin: top left;
              }
              * { color: black !important; border-color: black !important; background-color: transparent !important; }
              /* 기존 라벨 CSS */
              ${document.querySelector('style').innerHTML}
            </style>
          </head>
          <body>
            ${labelHtml}
          </body>
        </html>
      `
    }];

    await qz.print(config, printData);

    btn.textContent = `✅ ${qty}장 출력 완료!`;
    btn.style.background = '#16a34a';
    setTimeout(() => { btn.textContent = origText; btn.style.background = ''; btn.disabled = false; }, 3000);
  } catch(e) {
    console.error('[QZ Tray 오류]', e);
    btn.textContent = origText;
    btn.disabled = false;
    const msg = e.message || String(e);
    if (msg.includes('Unable to establish') || msg.includes('WebSocket') || msg.includes('ECONNREFUSED') || msg.includes('1006')) {
      alert(
        '🔴 QZ Tray에 연결할 수 없습니다.\n\n' +
        '▶ 해결 순서:\n' +
        '① 작업표시줄에서 QZ Tray 확인\n' +
        '   ↳ 없으면: C:\\Program Files\\QZ Tray\\qz-tray.exe 실행\n' +
        '② QZ Tray 트레이 아이콘 우클릭\n' +
        '   ↳ "Allow unsigned apps" 체크 확인\n' +
        '③ 이 페이지 새로고침 후 다시 시도\n\n' +
        'ℹ️ HTTPS 사이트에서는 브라우저가 QZ Tray 연결을 차단할 수 있습니다.\n' +
        '   ↳ 브라우저에서 https://localhost:8181 접속 후 "안전하지 않음 무시" 선택\n\n' +
        '오류: ' + msg
      );
    } else if (msg.includes('로드')) {
      alert(msg);
    } else {
      alert('프린터 연결 실패:\n' + msg);
    }
  }
}


// ── 초기 렌더링 ──────────────────────────────────────────────
render();
</script>
</body>
</html>
